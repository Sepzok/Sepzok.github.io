<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sepzok open-source demos</title>
    <meta
      name="description"
      content="Sepzok open-source demos on GitHub Pages. Company site: sepzok.com / en.sepzok.com."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        --ink: #142033;
        --muted: #5a6b82;
        --line: #d7e0ec;
        --paper: #f7f9fc;
        --accent: #2f6fed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 3rem 1.25rem 4rem;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
      }
      .card {
        display: block;
        margin: 0.75rem 0;
        padding: 1rem 1.1rem;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        color: inherit;
        text-decoration: none;
      }
      .card:hover {
        border-color: var(--accent);
      }
      .card strong {
        display: block;
        color: var(--ink);
      }
      .note {
        margin-top: 2rem;
        font-size: 0.95rem;
      }
      a.plain {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sepzok open-source demos</h1>
      <p>
        GitHub Pages hosts side-project demos only. The company site is on
        <a class="plain" href="https://sepzok.com/">sepzok.com</a>
        (中文) and
        <a class="plain" href="https://en.sepzok.com/">en.sepzok.com</a>
        (English).
      </p>

      <a class="card" href="/handpan/">
        <strong>handpan</strong>
        Virtual handpan (RESONA) in the browser.
      </a>
      <a class="card" href="/aa-calc/">
        <strong>aa-calc</strong>
        Going-Dutch bill splitter.
      </a>
      <a class="card" href="/ear-training/">
        <strong>ear-training</strong>
        Pitch practice in the browser.
      </a>

      <p class="note">
        Source:
        <a class="plain" href="https://github.com/Sepzok">github.com/Sepzok</a>
      </p>
    </main>
  </body>
</html>
