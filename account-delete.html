    <p>注销后账号和用量记录会删掉，不能恢复。</p>

      <li>进入设置 → 账号</li>
      <li>点「注销账号」并确认</li>
    </ol>
    <p>应用里的注销和本页是同一套流程。没有安装随造时，请先安装并登录，再按上面的步骤操作。</p>
